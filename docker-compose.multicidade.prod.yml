version: '3.8'

x-app-image: &app-image
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
    args:
      PHP_VERSION: 8.4
      COMPOSER_VERSION: 2.8
      ENABLE_PACKAGE_REPORTS: ${ENABLE_PACKAGE_REPORTS:-false}
      ENABLE_PACKAGE_EDUCACENSO: ${ENABLE_PACKAGE_EDUCACENSO:-false}
      ENABLE_PACKAGE_TRANSPORTE: ${ENABLE_PACKAGE_TRANSPORTE:-false}
      ENABLE_PACKAGE_PRE_MATRICULA: ${ENABLE_PACKAGE_PRE_MATRICULA:-false}
      ENABLE_PACKAGE_DESPESAS: ${ENABLE_PACKAGE_DESPESAS:-false}
      ENABLE_PACKAGE_MERENDA: ${ENABLE_PACKAGE_MERENDA:-false}
      PACKAGE_REF_REPORTS: ${PACKAGE_REF_REPORTS:-}
      PACKAGE_REF_EDUCACENSO: ${PACKAGE_REF_EDUCACENSO:-}
      PACKAGE_REF_TRANSPORTE: ${PACKAGE_REF_TRANSPORTE:-}
      PACKAGE_REF_PRE_MATRICULA: ${PACKAGE_REF_PRE_MATRICULA:-}
      PACKAGE_REF_DESPESAS: ${PACKAGE_REF_DESPESAS:-}
      PACKAGE_REF_MERENDA: ${PACKAGE_REF_MERENDA:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
  image: ieducar-app:2.10-prod
  working_dir: /var/www/ieducar
  restart: unless-stopped

x-nginx-image: &nginx-image
  build:
    context: .
    dockerfile: docker/nginx/Dockerfile.prod
  image: ieducar-nginx:2.10-prod
  working_dir: /var/www/ieducar
  restart: unless-stopped

services:
  php_cidade1:
    <<: *app-image
    container_name: ieducar-php-cidade1-prod
    env_file:
      - ${ENV_CIDADE1_FILE:-.env.cidade1.example}
    depends_on:
      - redis_cidade1
    command: ["sh", "-lc", "sleep infinity"]

  fpm_cidade1:
    <<: *app-image
    container_name: ieducar-fpm-cidade1-prod
    env_file:
      - ${ENV_CIDADE1_FILE:-.env.cidade1.example}
    depends_on:
      - redis_cidade1
    command: ["php-fpm", "-F"]

  nginx_cidade1:
    <<: *nginx-image
    container_name: ieducar-nginx-cidade1-prod
    depends_on:
      - fpm_cidade1
    environment:
      SERVER_NAME: ieducar.cidade1.local
      FPM_UPSTREAM: fpm_cidade1
    ports:
      - "8081:80"
    command: >
      sh -lc "envsubst '$$SERVER_NAME $$FPM_UPSTREAM' < /etc/nginx/templates/default.template.conf > /etc/nginx/conf.d/default.conf
      && exec nginx -g 'daemon off;'"

  redis_cidade1:
    image: redis:8-alpine
    container_name: ieducar-redis-cidade1-prod
    restart: unless-stopped

  php_cidade2:
    <<: *app-image
    container_name: ieducar-php-cidade2-prod
    env_file:
      - ${ENV_CIDADE2_FILE:-.env.cidade2.example}
    depends_on:
      - redis_cidade2
    command: ["sh", "-lc", "sleep infinity"]

  fpm_cidade2:
    <<: *app-image
    container_name: ieducar-fpm-cidade2-prod
    env_file:
      - ${ENV_CIDADE2_FILE:-.env.cidade2.example}
    depends_on:
      - redis_cidade2
    command: ["php-fpm", "-F"]

  nginx_cidade2:
    <<: *nginx-image
    container_name: ieducar-nginx-cidade2-prod
    depends_on:
      - fpm_cidade2
    environment:
      SERVER_NAME: ieducar.cidade2.local
      FPM_UPSTREAM: fpm_cidade2
    ports:
      - "8082:80"
    command: >
      sh -lc "envsubst '$$SERVER_NAME $$FPM_UPSTREAM' < /etc/nginx/templates/default.template.conf > /etc/nginx/conf.d/default.conf
      && exec nginx -g 'daemon off;'"

  redis_cidade2:
    image: redis:8-alpine
    container_name: ieducar-redis-cidade2-prod
    restart: unless-stopped
