version: '3.8'

x-app-image: &app-image
  image: ${APP_IMAGE:?defina APP_IMAGE}
  working_dir: /var/www/ieducar
  restart: unless-stopped

x-nginx-image: &nginx-image
  image: ${NGINX_IMAGE:?defina NGINX_IMAGE}
  working_dir: /var/www/ieducar
  restart: unless-stopped

services:
  php_cidade1:
    <<: *app-image
    container_name: ieducar-php-${CIDADE1_SLUG:-cidade1}-prod
    env_file:
      - ${ENV_CIDADE1_FILE:-.env.cidade1}
    depends_on:
      - redis_cidade1
    command: ["sh", "-lc", "sleep infinity"]

  fpm_cidade1:
    <<: *app-image
    container_name: ieducar-fpm-${CIDADE1_SLUG:-cidade1}-prod
    env_file:
      - ${ENV_CIDADE1_FILE:-.env.cidade1}
    depends_on:
      - redis_cidade1
    command: ["php-fpm", "-F"]

  nginx_cidade1:
    <<: *nginx-image
    container_name: ieducar-nginx-${CIDADE1_SLUG:-cidade1}-prod
    depends_on:
      - fpm_cidade1
    environment:
      SERVER_NAME: ${SERVER_NAME_CIDADE1:-ieducar.cidade1.local}
      FPM_UPSTREAM: fpm_cidade1
    ports:
      - "${PORTA_CIDADE1:-81}:80"
    command: >
      sh -lc "envsubst '$$SERVER_NAME $$FPM_UPSTREAM' < /etc/nginx/templates/default.template.conf > /etc/nginx/conf.d/default.conf
      && exec nginx -g 'daemon off;'"

  redis_cidade1:
    image: redis:8-alpine
    container_name: ieducar-redis-${CIDADE1_SLUG:-cidade1}-prod
    restart: unless-stopped

  php_cidade2:
    <<: *app-image
    container_name: ieducar-php-${CIDADE2_SLUG:-cidade2}-prod
    env_file:
      - ${ENV_CIDADE2_FILE:-.env.cidade2}
    depends_on:
      - redis_cidade2
    command: ["sh", "-lc", "sleep infinity"]

  fpm_cidade2:
    <<: *app-image
    container_name: ieducar-fpm-${CIDADE2_SLUG:-cidade2}-prod
    env_file:
      - ${ENV_CIDADE2_FILE:-.env.cidade2}
    depends_on:
      - redis_cidade2
    command: ["php-fpm", "-F"]

  nginx_cidade2:
    <<: *nginx-image
    container_name: ieducar-nginx-${CIDADE2_SLUG:-cidade2}-prod
    depends_on:
      - fpm_cidade2
    environment:
      SERVER_NAME: ${SERVER_NAME_CIDADE2:-ieducar.cidade2.local}
      FPM_UPSTREAM: fpm_cidade2
    ports:
      - "${PORTA_CIDADE2:-82}:80"
    command: >
      sh -lc "envsubst '$$SERVER_NAME $$FPM_UPSTREAM' < /etc/nginx/templates/default.template.conf > /etc/nginx/conf.d/default.conf
      && exec nginx -g 'daemon off;'"

  redis_cidade2:
    image: redis:8-alpine
    container_name: ieducar-redis-${CIDADE2_SLUG:-cidade2}-prod
    restart: unless-stopped
