x-app-image: &app-image
  image: ${APP_IMAGE:?defina APP_IMAGE}
  working_dir: /var/www/ieducar
  restart: unless-stopped

x-nginx-image: &nginx-image
  image: ${NGINX_IMAGE:?defina NGINX_IMAGE}
  working_dir: /var/www/ieducar
  restart: unless-stopped

# Worker de fila (jobs longos: verificar CPF eSUS/cadastro cidadão, exports, etc.)
# --queue=default,export: DatabaseToCsvExporter usa a fila "export".
x-queue-command: &queue-command
  [
    "php",
    "artisan",
    "queue:work",
    "redis",
    "--queue=default,export",
    "--sleep=1",
    "--tries=1",
    "--timeout=1800",
    "--memory=512",
  ]

services:
  php_cidade1:
    <<: *app-image
    container_name: ieducar-php-${CIDADE1_SLUG:-cidade1}-prod
    env_file:
      - ${ENV_CIDADE1_FILE:-.env.cidade1}
    depends_on:
      - redis_cidade1
    command: ["sh", "-lc", "sleep infinity"]
    volumes:
      - ieducar_storage_cidade1:/var/www/ieducar/storage

  fpm_cidade1:
    <<: *app-image
    container_name: ieducar-fpm-${CIDADE1_SLUG:-cidade1}-prod
    env_file:
      - ${ENV_CIDADE1_FILE:-.env.cidade1}
    depends_on:
      - redis_cidade1
    command: ["php-fpm", "-F"]
    volumes:
      - ieducar_storage_cidade1:/var/www/ieducar/storage

  queue_cidade1:
    <<: *app-image
    container_name: ieducar-queue-${CIDADE1_SLUG:-cidade1}-prod
    env_file:
      - ${ENV_CIDADE1_FILE:-.env.cidade1}
    depends_on:
      - redis_cidade1
    command: *queue-command
    volumes:
      - ieducar_storage_cidade1:/var/www/ieducar/storage

  nginx_cidade1:
    <<: *nginx-image
    container_name: ieducar-nginx-${CIDADE1_SLUG:-cidade1}-prod
    depends_on:
      - fpm_cidade1
    environment:
      SERVER_NAME: ${SERVER_NAME_CIDADE1:-ieducar.cidade1.local}
      FPM_UPSTREAM: fpm_cidade1
    ports:
      - "${PORTA_CIDADE1:-81}:80"
    volumes:
      - ieducar_storage_cidade1:/var/www/ieducar/storage

  redis_cidade1:
    image: redis:8-alpine
    container_name: ieducar-redis-${CIDADE1_SLUG:-cidade1}-prod
    restart: unless-stopped

