x-php: &php
  build:
    context: docker/php
    args:
      PHP_VERSION: 8.4
      COMPOSER_VERSION: 2.8
      HOST_UID: ${HOST_UID:-1001}
      HOST_GID: ${HOST_GID:-1001}
  image: php:8.4-ieducar
  working_dir: /var/www/ieducar
  volumes:
    - ./:/var/www/ieducar
    # Repositórios ao lado do i-educar (../). Com USE_LOCAL_PACKAGES=true o install
    # reutiliza estes mounts e não clona/fetch do remoto.
    - ../i-educar-reports-package:/var/www/ieducar/packages/portabilis/i-educar-reports-package
    - ../i-educar-educacenso-package:/var/www/ieducar/packages/portabilis/i-educar-educacenso-package
    - ../merenda:/var/www/ieducar/packages/merenda/merenda-escolar
    - ../despesas-escolar:/var/www/ieducar/packages/despesas-escolar
    - ../cdn-config:/var/www/cdn-config:ro
  links:
    - postgres
    - redis
  depends_on:
    postgres:
      condition: service_started
    redis:
      condition: service_started
  environment:
    CACHE_DRIVER: redis
    REDIS_HOST: redis
    DB_HOST: postgres
    PGPASSWORD: ${DB_PASSWORD:-ieducar}
    # docker/php/install-extra-packages.sh (laravel-permission-entrypoint); ver .env.example
    RUN_EXTRA_PACKAGES_INSTALL: ${RUN_EXTRA_PACKAGES_INSTALL:-false}
    STALE_EXTRA_PACKAGES_LOCK_MINUTES: ${STALE_EXTRA_PACKAGES_LOCK_MINUTES:-45}
    USE_LOCAL_PACKAGES: ${USE_LOCAL_PACKAGES:-false}
    CDN_CONFIG_PATH: ${CDN_CONFIG_PATH:-/var/www/cdn-config}
    ENABLE_PACKAGE_REPORTS: ${ENABLE_PACKAGE_REPORTS:-false}
    ENABLE_PACKAGE_EDUCACENSO: ${ENABLE_PACKAGE_EDUCACENSO:-false}
    ENABLE_PACKAGE_TRANSPORTE: ${ENABLE_PACKAGE_TRANSPORTE:-false}
    ENABLE_PACKAGE_PRE_MATRICULA: ${ENABLE_PACKAGE_PRE_MATRICULA:-false}
    ENABLE_PACKAGE_DESPESAS: ${ENABLE_PACKAGE_DESPESAS:-false}
    ENABLE_PACKAGE_MERENDA: ${ENABLE_PACKAGE_MERENDA:-false}
    GIT_TOKEN: ${GIT_TOKEN:-}
    PACKAGE_REF_REPORTS: ${PACKAGE_REF_REPORTS:-}
    PACKAGE_REF_EDUCACENSO: ${PACKAGE_REF_EDUCACENSO:-}
    PACKAGE_REF_TRANSPORTE: ${PACKAGE_REF_TRANSPORTE:-}
    PACKAGE_REF_PRE_MATRICULA: ${PACKAGE_REF_PRE_MATRICULA:-}
    PACKAGE_REF_DESPESAS: ${PACKAGE_REF_DESPESAS:-}
    PACKAGE_REF_MERENDA: ${PACKAGE_REF_MERENDA:-}
    MERENDA_INSTALL_SCRIPT: ${MERENDA_INSTALL_SCRIPT:-}
    MERENDA_PACKAGE_VERSION: ${MERENDA_PACKAGE_VERSION:-2.11.0}
    PACKAGE_REPO_MERENDA: ${PACKAGE_REPO_MERENDA:-}
    PACKAGE_REPO_DESPESAS: ${PACKAGE_REPO_DESPESAS:-}
  extra_hosts:
    - host.docker.internal:host-gateway

services:

  php:
    <<: *php
    container_name: ieducar-php
    links:
      - postgres
      - redis
    environment:
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      DB_HOST: postgres
      PGPASSWORD: ieducar
    working_dir: /var/www/ieducar
    entrypoint: ["sh", "/usr/local/bin/entrypoint.sh"] 

  fpm:
    <<: *php
    container_name: ieducar-fpm
    user: root
    # Script no volume (./) — evita bind extra em /usr/local/bin (docker-compose 1.29 + Docker novo: KeyError ContainerConfig).
    entrypoint:
      - /bin/sh
      - /var/www/ieducar/docker/php/laravel-permission-entrypoint.sh
      - /usr/local/bin/docker-php-entrypoint
    command: ["php-fpm"]

  horizon:
    <<: *php
    container_name: ieducar-horizon
    user: root
    entrypoint:
      - /bin/sh
      - /var/www/ieducar/docker/php/laravel-permission-entrypoint.sh
    command: ["php", "/var/www/ieducar/artisan", "horizon"]
    restart: always

  nginx:
    container_name: ieducar-nginx
    image: nginx:1.28-alpine
    links:
      - fpm
    working_dir: /var/www/ieducar
    environment:
      WAIT_FPM_MAX_SEC: ${WAIT_FPM_MAX_SEC:-900}
    entrypoint: ["/wait-and-start.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./:/var/www/ieducar
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./docker/nginx/snippets:/etc/nginx/snippets/
      - ./docker/nginx/wait-and-start.sh:/wait-and-start.sh:ro
    ports:
      - ${DOCKER_NGINX_PORT:-80}:80
      - ${DOCKER_NGINX_SSL_PORT:-443}:443
    depends_on:
      fpm:
        condition: service_started

  postgres:
    container_name: ieducar-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ieducar}
      POSTGRES_USER: ${DB_USERNAME:-ieducar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ieducar}
      PGUSER: ${DB_USERNAME:-ieducar}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ../backup:/backup
    command: >
      postgres
      -c logging_collector=off
      -c log_statement=all
      -c log_destination=stderr
      -c log_min_duration_statement=0
    ports:
      - ${DOCKER_POSTGRES_PORT:-5432}:5432

  redis:
    container_name: ieducar-redis
    image: redis:8-alpine
    restart: always
    ports:
      - ${DOCKER_REDIS_PORT:-6379}:6379

volumes:
    postgres:
